<div class="flex min-h-screen flex-col bg-slate-950 text-slate-100">
  <!--
    Title block: intentionally NOT sticky. It scrolls out of view so the tab bar
    can take over the top of the viewport without any magic offset values.
  -->
  <header class="border-b border-slate-800 bg-slate-900/60">
    <div class="mx-auto w-full max-w-6xl px-4 py-4">
      <h1
        class="bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-2xl font-bold text-transparent"
      >
        🌍 Timezones in Angular
      </h1>
      <p class="mt-1 text-sm text-slate-400">
        Understanding dates, offsets, and how Angular handles them
      </p>
    </div>
  </header>

  <!--
    Tab bar: pinned to the very top of the viewport. `bg-slate-950` is fully
    opaque so scrolling content can never bleed through the tabs, and the bar
    keeps a fixed height because nothing inside it collapses.
  -->
  <nav
    class="sticky top-0 z-40 border-b border-slate-800 bg-slate-950/95 shadow-lg shadow-slate-950/50 backdrop-blur-md"
    aria-label="Topics"
  >
    <div class="mx-auto w-full max-w-6xl px-4">
      <ul class="flex h-14 items-center gap-1 overflow-x-auto">
        @for (item of navItems; track item.path) {
          <li class="shrink-0">
            <a
              [routerLink]="item.path"
              routerLinkActive="bg-cyan-500/20 text-cyan-300 border-cyan-500/50"
              #rla="routerLinkActive"
              [attr.aria-current]="rla.isActive ? 'page' : null"
              class="block rounded-lg border border-transparent px-4 py-2 text-sm font-medium whitespace-nowrap text-slate-400 transition-colors hover:bg-slate-800 hover:text-slate-200 focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:outline-none"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  </nav>

  <!--
    `min-h` reserves vertical space so switching between tabs with different
    content lengths does not make the page jump or lose the scroll position.
  -->
  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8">
    <div class="min-h-[70vh]">
      <router-outlet />
    </div>
  </main>

  <footer class="mt-12 border-t border-slate-800 py-6">
    <div class="mx-auto w-full max-w-6xl px-4 text-center text-sm text-slate-500">
      <p>Built with Angular 22 (zoneless) — no zone.js required</p>
      <p class="mt-1">An educational app about timezones and date handling</p>
    </div>
  </footer>
</div>
